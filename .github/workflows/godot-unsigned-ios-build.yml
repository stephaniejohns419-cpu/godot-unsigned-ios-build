name: 📱 Godot iOS Unsigned Editor Engine Build
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  ios-editor-unsigned:
    runs-on: macos-latest
    
    steps:
      - name: 📥 Checkout Repository Source
        uses: actions/checkout@v4

      - name: 🐍 Set up Python Environment
        uses: actions/actions-setup-python@v5
        with:
          python-version: '3.x'

      - name: 📦 Install SCons & Toolchain Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scons
          xcrun --show-sdk-path --sdk iphoneos

      - name: 🛡️ Set up SCons Compile Cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.scons_cache/
          key: ${{ runner.os }}-godot-unsigned-editor-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-godot-unsigned-editor-

      - name: 🔧 Auto-Patch Platform Validation Locks
        run: |
          python3 -c '
          import os
          for target_file in ["platform/ios/detect.py", "platform/ios/config.py"]:
              if os.path.exists(target_file):
                  with open(target_file, "r") as f: content = f.read()
                  content = content.replace("env[\"tools\"] = \"no\"", "# env[\"tools\"] = \"no\"")
                  content = content.replace("if env[\"tools\"] == \"yes\":", "if False:")
                  content = content.replace("if env[\"tools\"] == \"yes\" or env[\"target\"] == \"editor\":", "if False:")
                  with open(target_file, "w") as f: f.write(content)
          
          ds_file = "platform/ios/display_server_ios.mm"
          if os.path.exists(ds_file):
              with open(ds_file, "r") as f: content = f.read()
              content = content.replace("bool is_editor = false;", "bool is_editor = true;")
              with open(ds_file, "w") as f: f.write(content)
          '

      - name: 🏗️ Compile Unsigned Editor (arm64 Tools)
        env:
          SCONS_CACHE: ${{ github.workspace }}/.scons_cache/
        run: |
          # generate_bundle=yes groups compilation objects into a physical .app container 
          scons platform=ios arch=arm64 target=editor tools=yes generate_bundle=yes production=yes vsproj=no

      - name: 📦 Build Unsigned IPA Structure (Bypassing Template Step)
        run: |
          cd bin/
          mkdir -p Payload
          
          # Dynamic target scan to ensure whichever .app folder name SCons spits out gets captured
          TARGET_APP=$(find . -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$TARGET_APP" ]; then
            echo "❌ Compilation Error: SCons app bundle container missing."
            exit 1
          fi
          
          echo "Found bundle target: $TARGET_APP"
          cp -r "$TARGET_APP" Payload/
          
          # Zip the structural payload directly into an install-ready package profile
          zip -r godot-unsigned-editor.ipa Payload/
          echo "Unsigned package archive formatting complete."

      - name: 📤 Upload Finished Editor Engine
        uses: actions/upload-artifact@v4
        with:
          name: godot-ios-editor-unsigned
          path: bin/godot-unsigned-editor.ipa
          if-no-files-found: error

        
